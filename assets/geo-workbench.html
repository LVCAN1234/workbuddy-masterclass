<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谋仕GEO · AI 搜索引擎友好度诊断台</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1f2733; --sub:#5b6675;
    --line:#e4e9f2; --brand:#2f6bff; --brand2:#7aa2ff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 6px 24px rgba(31,39,51,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;padding:24px}
  .wrap{max-width:980px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
  h1{font-size:22px}
  .tag{font-size:13px;color:var(--sub);margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
  textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;
    padding:14px;font-size:14px;resize:vertical;font-family:inherit;color:var(--ink);background:#fbfcfe}
  textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .primary{background:var(--brand);color:#fff}
  .primary:hover{background:#2257e0}
  .ghost{background:#eef2fb;color:var(--brand)}
  .ghost:hover{background:#e2e9fb}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .hidden{display:none}
  .score-big{display:flex;align-items:center;gap:20px;margin-bottom:18px}
  .ring{--p:0;width:110px;height:110px;border-radius:50%;
    background:conic-gradient(var(--brand) calc(var(--p)*1%), #eef1f6 0);
    display:flex;align-items:center;justify-content:center;position:relative;flex:none}
  .ring::after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
  .ring b{position:relative;font-size:30px;z-index:1}
  .ring small{position:relative;z-index:1;font-size:12px;color:var(--sub)}
  .score-txt h2{font-size:18px;margin-bottom:4px}
  .score-txt p{font-size:13px;color:var(--sub)}
  .dim{margin-bottom:14px}
  .dim-head{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
  .bar{height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
  .tips{margin-top:6px;font-size:13px;color:var(--sub)}
  .tips li{margin-left:18px;margin-top:3px}
  .export{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .legend{font-size:12px;color:var(--sub);margin-top:10px}
  footer{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">G</div>
    <div>
      <h1>谋仕GEO · AI 搜索引擎友好度诊断台</h1>
    </div>
  </header>
  <div class="tag">把网页内容 / 文章粘进来，立刻看它在豆包、元宝、DeepSeek 等 AI 搜索引擎眼里的「好懂程度」。规则驱动、离线可用，是「Agent 工作台」课程的演示原型。</div>

  <div class="card">
    <label for="content">① 粘贴要诊断的内容（网页正文 / 公众号文章 / 产品介绍）</label>
    <textarea id="content" placeholder="例如：粘贴一篇你打算做 GEO 优化的文章……"></textarea>
    <div class="btns">
      <button class="primary" id="diagnose">开始诊断</button>
      <button class="ghost" id="loadSample">加载示例</button>
      <button class="ghost" id="clearBtn">清空</button>
    </div>
    <div class="hint">提示：AI 搜索引擎靠「读懂结构 + 抽取事实 + 引用来源」来决定是否把你的内容放进回答。本台从 5 个维度打分。</div>
  </div>

  <div class="card hidden" id="result">
    <div class="score-big">
      <div class="ring" id="ring"><b id="totalScore">0</b><small>综合分</small></div>
      <div class="score-txt">
        <h2 id="grade">—</h2>
        <p id="gradeDesc">—</p>
      </div>
    </div>
    <div id="dims"></div>
    <div class="legend">维度权重：结构 20% · 实体覆盖 20% · 来源引用 20% · 权威信号 20% · AI 可提取 20%</div>
    <div class="export">
      <button class="ghost" id="copyBtn">复制诊断报告</button>
      <button class="primary" id="mdCopyBtn">复制客户报告(Markdown)</button>
      <button class="ghost" id="downloadBtn">下载 .txt 报告</button>
    </div>
  </div>

  <footer>谋仕GEO 演示原型 · 纯前端规则分析，可作为真实 GEO 诊断流水线的前端雏形</footer>
</div>

<script>
const SAMPLE = `生成式引擎优化（GEO）是让内容更容易被 AI 搜索引擎收录和引用的新方法论。

传统 SEO 追求排名，GEO 追求"被引用"。当用户问豆包、元宝、DeepSeek 一个问题时，AI 会从全网抽取可信内容生成答案。你的内容若结构清晰、有权威来源、数据扎实，就更可能被引用。

为什么重要？
1. 流量入口正在从"蓝色链接"转向"AI 直接回答"。
2. 品牌曝光从"点进网站"变成"出现在答案里"。
3. 可信度由 AI 替用户把关。

据相关研究显示，结构化、带出处的内容被 AI 引用的概率显著提升。谋仕GEO 建议：用清晰小标题、补充作者与发布日期、引用权威来源、提供 FAQ 问答。

作者：谋仕GEO 研究院
发布日期：2026-08-11`;

const ENTITIES = ["生成式引擎优化","GEO","AI","人工智能","大模型","大语言模型","引用","来源","结构化数据","EEAT","E-E-A-T","权威","可信","问答","FAQ","知识图谱","语义","检索","搜索引擎","豆包","元宝","DeepSeek","摘要","上下文","内容","优化"];

function count(re, s){ const m = s.match(re); return m ? m.length : 0; }

function analyze(text){
  const dims = [];

  // 1. 结构清晰度
  let score = 0;
  const headings = count(/^#+\s/gm, text) + count(/^\s*\d+[.、]/gm, text);
  const paras = text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const avgLen = paras.length ? paras.reduce((a,p)=>a+p.length,0)/paras.length : 0;
  const hasList = /^\s*[-*]\s|^\s*\d+[.、]\s/gm.test(text);
  score += Math.min(40, headings*13);
  score += (avgLen>=60 && avgLen<=240) ? 30 : (avgLen>0 ? 15 : 0);
  score += hasList ? 30 : 0;
  dims.push({name:"结构清晰度", score:Math.round(Math.min(100,score)),
    tips:["用 H2/H3 小标题把文章分层（建议 ≥3 个）","段落别太长，单段控制在 60–240 字","关键信息用列表（1. 2. 或 -）呈现"]});

  // 2. 实体覆盖度
  const hit = ENTITIES.filter(e=>text.includes(e)).length;
  const entScore = Math.round(hit/ENTITIES.length*100);
  dims.push({name:"实体覆盖度", score:entScore,
    tips:["覆盖本主题的核心实体词（GEO/AI/引用/结构化数据等）","避免只喊口号，把概念写具体","出现行业术语时顺带解释，方便 AI 理解"]});

  // 3. 来源与引用
  let s3 = 0;
  const links = count(/https?:\/\//g, text);
  const refWords = ["来源","参考","引用","据","研究表明","数据","公开"];
  const hasRef = refWords.some(w=>text.includes(w));
  s3 += Math.min(50, links*25);
  s3 += hasRef ? 50 : 0;
  dims.push({name:"来源与引用", score:Math.round(Math.min(100,s3)),
    tips:["关键论点附上出处链接或「据 XX 研究显示」","区分观点与事实，事实尽量给来源","引用权威媒体 / 论文 / 官方文档"]});

  // 4. 权威信号 E-E-A-T
  let s4 = 0;
  const nums = count(/\d+(\.\d+)?\s?%/g, text) + count(/\d+\s?(个|项|倍|年)/g, text);
  const authWords = ["作者","发布","机构","公司","团队","研究院","专家","认证"];
  const hasAuth = authWords.some(w=>text.includes(w));
  const hasDate = /\d{4}\s?年|\d{4}[-/]\d{1,2}/.test(text);
  s4 += Math.min(35, nums*17);
  s4 += hasAuth ? 30 : 0;
  s4 += hasDate ? 35 : 0;
  dims.push({name:"权威信号 (E-E-A-T)", score:Math.round(Math.min(100,s4)),
    tips:["标注作者 / 发布机构，建立经验与专业度","写上发布日期，体现时效性","用具体数字 / 百分比替代模糊表述"]});

  // 5. AI 可提取性
  let s5 = 0;
  const sentences = text.split(/[。！？!?；;\n]/).map(s=>s.trim()).filter(Boolean);
  const shortCnt = sentences.filter(s=>s.length<=40).length;
  const shortRatio = sentences.length ? shortCnt/sentences.length : 0;
  const hasQA = text.includes("？")||text.includes("?")||text.includes("问答")||text.includes("FAQ");
  s5 += Math.round(shortRatio*40);
  s5 += hasQA ? 30 : 0;
  s5 += headings>=3 ? 30 : 0;
  dims.push({name:"AI 可提取性", score:Math.round(Math.min(100,s5)),
    tips:["多用短句，方便大模型抽取要点","加 FAQ / 问答结构，直接命中用户问题","小标题即论点，让 AI 秒懂每段在讲啥"]});

  const total = Math.round(dims.reduce((a,d)=>a+d.score,0)/dims.length);
  return {dims, total};
}

function gradeOf(t){
  if(t>=80) return ["优秀 · 易被 AI 引用","结构、事实、来源都到位，AI 搜索引擎很愿意把它放进答案。"];
  if(t>=60) return ["良好 · 有提升空间","基础不错，补强薄弱维度后引用概率明显提高。"];
  if(t>=40) return ["及格 · 需优化","已有雏形，但多个维度偏弱，建议按建议逐项整改。"];
  return ["偏弱 · 优先重做","目前 AI 较难理解与引用，建议先搭好结构与来源再发布。"];
}

function colorOf(s){ return s>=80?"var(--good)":s>=60?"var(--warn)":"var(--bad)"; }

function render(r){
  document.getElementById("ring").style.setProperty("--p", r.total);
  document.getElementById("totalScore").textContent = r.total;
  const [g,d] = gradeOf(r.total);
  document.getElementById("grade").textContent = g;
  document.getElementById("gradeDesc").textContent = d;
  const box = document.getElementById("dims");
  box.innerHTML = "";
  r.dims.forEach(dim=>{
    const weak = dim.score<70;
    const el = document.createElement("div");
    el.className = "dim";
    const tips = weak ? `<ul class="tips">${dim.tips.map(t=>`<li>${t}</li>`).join("")}</ul>` : "";
    el.innerHTML = `<div class="dim-head"><span>${dim.name}</span><span style="color:${colorOf(dim.score)}">${dim.score} 分</span></div>
      <div class="bar"><i style="width:${dim.score}%;background:${colorOf(dim.score)}"></i></div>${tips}`;
    box.appendChild(el);
  });
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function buildReport(r, text){
  const [g] = gradeOf(r.total);
  let out = `【谋仕GEO · AI 搜索引擎友好度诊断报告】\n综合得分：${r.total} / 100（${g}）\n生成时间：${new Date().toLocaleString("zh-CN")}\n\n`;
  r.dims.forEach(d=>{
    out += `▸ ${d.name}：${d.score} 分\n`;
    if(d.score<70){ d.tips.forEach(t=>out+=`   - 建议：${t}\n`); }
  });
  out += `\n— 被诊断内容预览 —\n${text.slice(0,200)}${text.length>200?"…":""}`;
  return out;
}

// 给客户的正式报告（Markdown，可直接粘贴/导入腾讯文档）
function buildMarkdown(r, text){
  const [g] = gradeOf(r.total);
  const time = new Date().toLocaleString("zh-CN");
  let md = `# 谋仕GEO · AI 搜索引擎友好度诊断报告\n\n`;
  md += `- **综合得分**：${r.total} / 100（${g}）\n`;
  md += `- **生成时间**：${time}\n`;
  md += `- **被诊断内容**：约 ${text.length} 字\n\n`;
  md += `## 一、五维评分\n\n`;
  md += `| 维度 | 得分 | 评价 |\n|------|------|------|\n`;
  r.dims.forEach(d=>{
    const comment = d.score>=80?"优秀":d.score>=60?"良好":d.score>=40?"一般":"偏弱";
    md += `| ${d.name} | ${d.score} | ${comment} |\n`;
  });
  md += `\n## 二、整改建议（按优先级）\n\n`;
  const items = [];
  r.dims.forEach(d=>{ if(d.score<70) d.tips.forEach(t=>items.push(`1. 【${d.name}】${t}`)); });
  if(items.length===0){ md += `当前各项均达标，保持并更新即可。\n`; }
  else { md += items.join("\n") + "\n"; }
  md += `\n---\n*本报告由 谋仕GEO 诊断台 自动生成，供 GEO 优化参考。*\n`;
  return md;
}

document.getElementById("diagnose").onclick = ()=>{
  const t = document.getElementById("content").value.trim();
  if(!t){ alert("请先粘贴内容"); return; }
  render(analyze(t));
};
document.getElementById("loadSample").onclick = ()=>{
  document.getElementById("content").value = SAMPLE;
  render(analyze(SAMPLE));
};
document.getElementById("clearBtn").onclick = ()=>{
  document.getElementById("content").value = "";
  document.getElementById("result").classList.add("hidden");
};
document.getElementById("copyBtn").onclick = ()=>{
  const t = document.getElementById("content").value.trim();
  navigator.clipboard.writeText(buildReport(analyze(t), t)).then(()=>alert("报告已复制到剪贴板"));
};
document.getElementById("mdCopyBtn").onclick = ()=>{
  const t = document.getElementById("content").value.trim();
  if(!t){ alert("请先粘贴内容并诊断"); return; }
  navigator.clipboard.writeText(buildMarkdown(analyze(t), t)).then(()=>alert("已复制 Markdown 客户报告，可粘贴到腾讯文档 / 直接发客户"));
};
document.getElementById("downloadBtn").onclick = ()=>{
  const t = document.getElementById("content").value.trim();
  const blob = new Blob([buildReport(analyze(t), t)], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "谋仕GEO诊断报告.txt";
  a.click();
};
</script>
</body>
</html>
